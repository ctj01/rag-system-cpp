name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # llama.cpp is disabled in CI: the test suite runs on the deterministic
      # stubs, and building the inference backend would add ~10 minutes per
      # run without covering any additional project code.
      - name: Configure
        run: cmake -B build -S . -DCMAKE_BUILD_TYPE=Release -DVECDB_WITH_LLAMA=OFF

      - name: Build
        run: cmake --build build -j

      - name: Test
        run: ctest --test-dir build --output-on-failure
